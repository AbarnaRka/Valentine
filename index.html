<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Letter For You 💌</title>

<style>
/* ---------- PAGE ---------- */
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #ffe6eb, #ffb3c1);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* ---------- FLOATING HEARTS ---------- */
.heart {
    position: absolute;
    bottom: -30px;
    font-size: 20px;
    animation: float 7s linear infinite;
    opacity: 0.7;
}

@keyframes float {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-120vh); opacity: 0; }
}

/* ---------- ENVELOPE ---------- */
.envelope {
    width: 320px;
    height: 220px;
    position: relative;
    cursor: pointer;
}

.back {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

/* ---------- FLAP ---------- */
.flap {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-top: 110px solid #ff4d6d;
    top: 0;
    transform-origin: top;
    transition: transform 1s ease;
    z-index: 3;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

/* ---------- LETTER ---------- */
.letter {
    position: absolute;
    width: 90%;
    height: 80%;
    background: #fffdf8;
    top: 10%;
    left: 5%;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transform: translateY(60px);
    opacity: 0;
    transition: all 1.2s ease;
    z-index: 2;
}

.envelope.open .letter {
    transform: translateY(-90px);
    opacity: 1;
}

h2 {
    color: #d6336c;
}

p {
    font-size: 16px;
    color: #555;
    line-height: 1.6;
}

/* ---------- BUTTONS ---------- */
.buttons {
    margin-top: 15px;
}

button {
    padding: 10px 22px;
    border: none;
    border-radius: 25px;
    font-size: 15px;
    cursor: pointer;
    margin: 6px;
}

#yes {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 0 12px rgba(255,77,109,0.6);
}

#no {
    background: #adb5bd;
    color: white;
}

/* ---------- CONFETTI ---------- */
.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    animation: fall 2s linear forwards;
}

@keyframes fall {
    from { transform: translateY(0) rotate(0); opacity: 1; }
    to { transform: translateY(120vh) rotate(720deg); opacity: 0; }
}
</style>
</head>

<body>

<div class="envelope" onclick="openEnvelope()" id="env">
    <div class="flap"></div>
    <div class="back"></div>

    <div class="letter">
        <h2>My Dearest 💖</h2>
        <p>
            This letter carries all the words<br>
            I sometimes forget to say aloud.<br><br>
            You make simple moments magical,<br>
            And smiles come naturally with you.
        </p>

        <h3>Will you be my Valentine? 💌</h3>

        <div class="buttons">
            <button id="yes" onclick="yesClicked(event)">YES 💖</button>
            <button id="no" onmouseover="moveNo()">NO 😜</button>
        </div>
    </div>
</div>

<script>
/* ---------- OPEN ENVELOPE ---------- */
function openEnvelope() {
    document.getElementById("env").classList.add("open");
}

/* ---------- FLOATING HEARTS ---------- */
for (let i = 0; i < 16; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (5 + Math.random() * 6) + "s";
    document.body.appendChild(heart);
}

/* ---------- NO BUTTON ESCAPE ---------- */
function moveNo() {
    const no = document.getElementById("no");
    const x = Math.random() * 100 - 50;
    const y = Math.random() * 50 - 25;
    no.style.transform = `translate(${x}px, ${y}px)`;
}

/* ---------- YES CLICKED ---------- */
function yesClicked(e) {
    e.stopPropagation();
    launchConfetti();

    document.querySelector(".letter").innerHTML = `
        <h2>💘 You Said YES 💘</h2>
        <p>
            This letter just became my favorite story.<br>
            Thank you for making my heart smile ❤️
        </p>
        <h3>Happy Valentine’s Day 🌹</h3>
    `;

    // Optional WhatsApp redirect
    /*
    setTimeout(() => {
        window.location.href =
        "https://wa.me/?text=" + encodeURIComponent("I said YES 💖 Happy Valentine’s Day!");
    }, 2000);
    */
}

/* ---------- CONFETTI ---------- */
function launchConfetti() {
    for (let i = 0; i < 120; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background =
            `hsl(${Math.random() * 360}, 100%, 50%)`;
        c.style.animationDuration = (1.4 + Math.random()) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2000);
    }
}
</script>

</body>
</html>
