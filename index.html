<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Little Story 💖</title>

<style>
/* ---------- BASE ---------- */
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #ffe6eb, #ffb3c1);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ---------- FLOATING HEARTS ---------- */
.heart {
    position: absolute;
    bottom: -30px;
    font-size: 22px;
    animation: float 7s linear infinite;
    opacity: 0.7;
}

@keyframes float {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-120vh); opacity: 0; }
}

/* ---------- STORY CARD ---------- */
.card {
    background: rgba(255,255,255,0.92);
    padding: 45px;
    border-radius: 28px;
    width: 90%;
    max-width: 460px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    z-index: 2;
}

/* ---------- TEXT ---------- */
#story {
    font-size: 18px;
    color: #444;
    min-height: 140px;
    line-height: 1.7;
}

.fade-in {
    animation: fadeIn 1.2s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ---------- QUESTION ---------- */
#question {
    display: none;
    margin-top: 25px;
}

button {
    padding: 12px 26px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
}

#yes {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 0 15px rgba(255,77,109,0.6);
    animation: glow 2s infinite;
}

@keyframes glow {
    0% { box-shadow: 0 0 10px rgba(255,77,109,0.5); }
    50% { box-shadow: 0 0 25px rgba(255,77,109,0.9); }
    100% { box-shadow: 0 0 10px rgba(255,77,109,0.5); }
}

#no {
    background: #adb5bd;
    color: white;
    position: relative;
}

/* ---------- CONFETTI ---------- */
.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    animation: fall 2s linear forwards;
}

@keyframes fall {
    from { transform: translateY(0) rotate(0deg); opacity: 1; }
    to { transform: translateY(120vh) rotate(720deg); opacity: 0; }
}
</style>
</head>

<body>

<div class="card">
    <div id="story"></div>

    <div id="question">
        <h2>So… 💕</h2>
        <h3>Will you be my Valentine?</h3>
        <button id="yes" onclick="yesClicked()">YES 💖</button>
        <button id="no" onmouseover="moveNo()">NO 😜</button>
    </div>
</div>

<script>
/* ---------- STORY TEXT ---------- */
const lines = [
    "Once upon a moment… ✨",
    "Two strangers crossed paths,",
    "And somehow, the ordinary became special.",
    "Smiles lasted longer.",
    "Silences felt warmer.",
    "And days felt brighter…",
    "Because you were there ❤️"
];

let index = 0;
const storyDiv = document.getElementById("story");

function showLine() {
    if (index < lines.length) {
        const p = document.createElement("p");
        p.textContent = lines[index];
        p.className = "fade-in";
        storyDiv.appendChild(p);
        index++;
        setTimeout(showLine, 1200);
    } else {
        document.getElementById("question").style.display = "block";
    }
}

showLine();

/* ---------- FLOATING HEARTS ---------- */
for (let i = 0; i < 18; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (5 + Math.random() * 6) + "s";
    document.body.appendChild(heart);
}

/* ---------- NO BUTTON ESCAPE ---------- */
function moveNo() {
    const no = document.getElementById("no");
    const x = Math.random() * 120 - 60;
    const y = Math.random() * 60 - 30;
    no.style.transform = `translate(${x}px, ${y}px)`;
}

/* ---------- YES CLICKED ---------- */
function yesClicked() {
    launchConfetti();
    document.querySelector(".card").innerHTML = `
        <h1>💘 You said YES! 💘</h1>
        <p>
            This moment means more than words can say.<br>
            Thank you for making this story beautiful ❤️
        </p>
        <h2>Happy Valentine’s Day 🌹</h2>
    `;

    // Optional WhatsApp redirect
    /*
    setTimeout(() => {
        window.location.href =
        "https://wa.me/?text=" + encodeURIComponent("I said YES 💖 Happy Valentine’s Day!");
    }, 2000);
    */
}

/* ---------- CONFETTI ---------- */
function launchConfetti() {
    for (let i = 0; i < 140; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background =
            `hsl(${Math.random() * 360}, 100%, 50%)`;
        c.style.animationDuration = (1.5 + Math.random()) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2000);
    }
}
</script>

</body>
</html>
