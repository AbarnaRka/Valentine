<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffdde1);
    background-size: 400% 400%;
    animation: gradient 12s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Background gradient animation */
@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Floating hearts */
.heart {
    position: absolute;
    font-size: 22px;
    opacity: 0.7;
    animation: floatUp 8s linear infinite;
}

@keyframes floatUp {
    from {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
    }
    30% { opacity: 0.8; }
    to {
        transform: translateY(-10vh) scale(1.3);
        opacity: 0;
    }
}

/* Card */
.card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    max-width: 420px;
    animation: popIn 1.4s ease;
    z-index: 2;
}

@keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

h1 {
    color: #d6336c;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 5px #ffb3c6; }
    to { text-shadow: 0 0 15px #ff4d6d; }
}

p {
    color: #555;
    font-size: 16px;
    line-height: 1.6;
    margin-top: 15px;
    animation: fadeUp 1.5s ease;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Valentine question heartbeat */
h2 {
    margin-top: 25px;
    color: #ff4d6d;
    animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    25% { transform: scale(1.05); }
    40% { transform: scale(1); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

.buttons {
    margin-top: 30px;
    position: relative;
}

button {
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

#yes {
    background: #ff4d6d;
    color: white;
}

#yes:hover {
    transform: scale(1.1);
    box-shadow: 0 0 15px #ff4d6d;
}

#no {
    background: #adb5bd;
    color: white;
    position: absolute;
}
</style>
</head>

<body>

<!-- Floating hearts -->
<span class="heart" style="left:10%; animation-delay:0s">❤️</span>
<span class="heart" style="left:25%; animation-delay:2s">💖</span>
<span class="heart" style="left:45%; animation-delay:4s">💕</span>
<span class="heart" style="left:65%; animation-delay:1s">💘</span>
<span class="heart" style="left:85%; animation-delay:3s">❤️</span>

<div class="card">
    <h1>Hey ❤️</h1>
    <p>
        Roses are red,<br>
        Violets are blue,<br>
        Every moment feels magical,<br>
        Especially when it's with you ✨
    </p>

    <h2>Will you be my Valentine?</h2>

    <div class="buttons">
        <button id="yes" onclick="yesClicked()">YES 💖</button>
        <button id="no" onmouseover="moveNo()">NO 😜</button>
    </div>
</div>

<script>
function yesClicked() {
    document.body.innerHTML = `
        <div style="
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI';
            background:#ffdde1;
            text-align:center;
            animation: fadeIn 1s ease;">
            <h1 style="color:#d6336c;">
                💘 Yay! You just made my heart smile 💘<br>
                Happy Valentine’s Day 💖
            </h1>
        </div>`;
}

function moveNo() {
    const noBtn = document.getElementById("no");
    const x = Math.random() * 220 - 110;
    const y = Math.random() * 220 - 110;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
}
</script>

</body>
</html>
