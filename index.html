<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just For You 💖</title>

<style>
/* ================= GLOBAL ================= */
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at center, #1a1d3b, #080a18);
    overflow: hidden;
}

/* ================= HEARTS ================= */
.heart {
    position: absolute;
    font-size: 18px;
    opacity: 0.8;
    animation: float 9s linear infinite;
}
@keyframes float {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-120vh); opacity: 0; }
}

/* ================= ENVELOPE ================= */
.envelope {
    width: 360px;
    height: 240px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    perspective: 1200px;
}

/* envelope back */
.envelope-back {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.45);
    position: absolute;
    z-index: 1;
}
