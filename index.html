<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just For You 💖</title>

<style>
/* ================== GLOBAL ================== */
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at center, #1a1d3b, #080a18);
    overflow: hidden;
    cursor: pointer;
}

/* ================== HEART UNIVERSE ================== */
.heart {
    position: absolute;
    font-size: 16px;
    opacity: 0.85;
    animation: float 9s linear infinite;
}

@keyframes float {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-120vh) scale(1.7); opacity: 0; }
}

.scene {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #1b1f3b, #0b0d1a);
  overflow: hidden;
}


/* ================== CENTER ENVELOPE ================== */
.envelope {
  position: relative;
  width: 380px;
  height: 260px;
  border-radius: 22px;
  perspective: 1200px;
}



/* flap */
.flap {
  position: absolute;
  inset: 0;
  background: #ff4d6d;
  clip-path: polygon(0 0, 100% 0, 50% 55%);
  transform-origin: top;
  transition: transform 1.2s ease;
  z-index: 3;
}

.envelope.open .flap {
  transform: rotateX(180deg);
}


.card {
  display: none !important;
}

/* ================== LETTER ================== */
.letter {
  position: absolute;
  inset: 0;
  background: #fffdf8;
  border-radius: 20px;
  padding: 26px;
  text-align: center;

  transform: translateY(80px);
  opacity: 0;
  transition: all 1.4s cubic-bezier(.22,.61,.36,1);

  z-index: 2;
}

.envelope.open .letter {
  transform: translateY(0);
  opacity: 1;
}



/* ================== STORY ================== */
#story p {
    font-size: 16px;
    color: #444;
    margin: 8px 0;
    animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ================== QUESTION ================== */
#question {
    display: none;
    margin-top: 12px;
}

button {
    padding: 10px 22px;
    border: none;
    border-radius: 25px;
    font-size: 15px;
    cursor: pointer;
    margin: 8px;
}

#yes {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 0 22px rgba(255,77,109,0.9);
    animation: glow 2s infinite;
}

@keyframes glow {
    0% { box-shadow: 0 0 10px rgba(255,77,109,0.6); }
    50% { box-shadow: 0 0 30px rgba(255,77,109,1); }
    100% { box-shadow: 0 0 10px rgba(255,77,109,0.6); }
}

#no {
    background: #adb5bd;
    color: white;
    position: relative;
}

/* ================== CONFETTI ================== */
.confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    animation: fall 2.2s linear forwards;
}

@keyframes fall {
    from { transform: translateY(0) rotate(0deg); opacity: 1; }
    to { transform: translateY(120vh) rotate(720deg); opacity: 0; }
}
</style>
</head>

<body>

<div class="scene">
  <div class="envelope" id="envelope">
    
    <div class="flap"></div>

    <div class="letter">
      <div class="letter-content">
        <p>I’ll remember this moment forever 💖</p>
        <p>Thank you for choosing this story with me.</p>

        <h2>Happy Valentine’s Day 🌹</h2>
      </div>
    </div>

  </div>
</div>



<script>
/* ========== HEART UNIVERSE ========== */
function spawnHeart(x = Math.random()*innerWidth, y = innerHeight) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["💖","💗","💓","💘"][Math.floor(Math.random()*4)];
    h.style.left = x + "px";
    h.style.top = y + "px";
    h.style.fontSize = (14 + Math.random()*24) + "px";
    h.style.animationDuration = (6 + Math.random()*6) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 10000);
}
setInterval(() => spawnHeart(), 280);

document.body.addEventListener("click", e => {
    for (let i=0;i<7;i++)
        spawnHeart(e.clientX + Math.random()*40-20, e.clientY);
});

/* ========== ENVELOPE OPEN ========== */
function openEnvelope() {
    document.getElementById("env").classList.add("open");
    showStory();
}

/* ========== STORY MODE ========== */
const lines = [
    "Hey You 💌",
    "I wanted to say this properly…",
    "Somehow, days feel warmer with you.",
    "Smiles come easier.",
    "Silences feel comfortable.",
    "And moments feel… right ✨",
    "So I was wondering ❤️"
];
let idx = 0;
const storyDiv = document.getElementById("story");

function showStory() {
    if (idx < lines.length) {
        const p = document.createElement("p");
        p.textContent = lines[idx++];
        storyDiv.appendChild(p);
        setTimeout(showStory, 1200);
    } else {
        document.getElementById("question").style.display = "block";
    }
}

/* ========== NO BUTTON ========== */
function moveNo() {
    const no = document.getElementById("no");
    no.style.transform =
        `translate(${Math.random()*140-70}px, ${Math.random()*60-30}px)`;
}

/* ========== YES CLICKED ========== */
function yesClicked(e) {
    e.stopPropagation();
    confetti();
    heartBurst();

    document.querySelector(".letter").innerHTML = `
        <h2>💖 You Said YES 💖</h2>
        <p>
            I’ll remember this moment forever ✨<br>
            Thank you for choosing this story with me.
        </p>
        <h3>Happy Valentine’s Day 🌹</h3>
    `;
}

/* ========== CONFETTI ========== */
function confetti() {
    for (let i=0;i<180;i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random()*100 + "vw";
        c.style.background =
            `hsl(${Math.random()*360},100%,50%)`;
        c.style.animationDuration = (1.5+Math.random())+"s";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),2200);
    }
}

/* ========== HEART BURST ========== */
function heartBurst() {
    for (let i=0;i<25;i++)
        spawnHeart(innerWidth/2 + Math.random()*60-30, innerHeight/2);
}
</script>

</body>
</html>
