<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just For You 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at center, #1a1d3b, #080a18);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Floating hearts */
.heart {
    position: absolute;
    font-size: 18px;
    animation: float 8s linear infinite;
}
@keyframes float {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
}

/* Envelope container */
.envelope {
    position: relative;
    width: 380px;
    height: 260px;
    cursor: pointer;
}

/* Envelope base */
.env-base {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 15px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    z-index: 1;
}

/* Flap */
.env-flap {
    position: absolute;
    width: 100%;
    height: 130px;
    background: #ff4d6d;
    clip-path: polygon(0 0, 50% 100%, 100% 0);
    transform-origin: top;
    transition: transform 1s ease;
    z-index: 3;
}

/* Letter */
.letter {
    position: absolute;
    width: 90%;
    left: 5%;
    height: 220px;
    background: #fffdf8;
    border-radius: 12px;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
    top: 20px;
    transform: translateY(0);
    transition: transform 1s ease;
    z-index: 2;
    overflow-y: auto;
}

/* OPEN animation */
.envelope.open .env-flap {
    transform: rotateX(180deg);
}

.envelope.open .letter {
    transform: translateY(-200px);
}

/* Text styling */
#story p {
    margin: 6px 0;
    color: #444;
}

#question {
    display: none;
    margin-top: 15px;
}

button {
    padding: 10px 22px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-size: 15px;
    margin: 8px;
}

#yes {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 0 20px rgba(255,77,109,0.8);
}

#no {
    background: #adb5bd;
    color: white;
}
</style>
</head>

<body>

<div class="envelope" id="env" onclick="openEnvelope()">
    <div class="env-flap"></div>
    <div class="env-base"></div>

    <div class="letter">
        <div id="story"></div>
        <div id="question">
            <h3>So tell me… 💖</h3>
            <h3>Will you be my Valentine?</h3>
            <button id="yes" onclick="yesClicked(event)">YES 💘</button>
            <button id="no" onmouseover="moveNo()">NO 😜</button>
        </div>
    </div>
</div>

<script>
/* Floating hearts */
function spawnHeart() {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["💖","💗","💓","💘"][Math.floor(Math.random()*4)];
    h.style.left = Math.random()*innerWidth + "px";
    h.style.top = innerHeight + "px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),8000);
}
setInterval(spawnHeart, 300);

/* Open envelope */
let opened = false;
function openEnvelope() {
    if (opened) return;
    opened = true;
    document.getElementById("env").classList.add("open");
    showStory();
}

/* Story animation */
const lines = [
    "Hey You 💌",
    "I wanted to say this properly…",
    "Somehow, days feel warmer with you.",
    "Smiles come easier.",
    "Silences feel comfortable.",
    "And moments feel… right ✨",
    "So I was wondering ❤️"
];

let i = 0;
const storyDiv = document.getElementById("story");

function showStory() {
    if (i < lines.length) {
        const p = document.createElement("p");
        p.textContent = lines[i++];
        storyDiv.appendChild(p);
        setTimeout(showStory, 900);
    } else {
        document.getElementById("question").style.display = "block";
    }
}

/* NO button moves */
function moveNo() {
    const no = document.getElementById("no");
    no.style.position = "relative";
    no.style.left = (Math.random()*150 - 75) + "px";
}

/* YES clicked */
function yesClicked(e) {
    e.stopPropagation();
    document.querySelector(".letter").innerHTML = `
        <h2>💖 You Said YES 💖</h2>
        <p>I’ll remember this moment forever ✨</p>
        <h3>Happy Valentine’s Day 🌹</h3>
    `;
}
</script>

</body>
</html>
