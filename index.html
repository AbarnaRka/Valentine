<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just For You 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1f2245, #0c0e1f);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
}

/* Floating hearts */
.heart {
    position: absolute;
    font-size: 18px;
    opacity: 0.8;
    animation: float 8s linear infinite;
}
@keyframes float {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
}

/* Intro Button */
#openBtn {
    padding: 16px 35px;
    font-size: 18px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    background: #ff4d6d;
    color: white;
    box-shadow: 0 0 30px rgba(255,77,109,0.8);
    transition: 0.3s ease;
}

#openBtn:hover {
    transform: scale(1.08);
}

/* Card */
.card {
    position: absolute;
    width: 420px;
    padding: 35px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 40px rgba(255,77,109,0.3);
    text-align: center;
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.8s ease;
}

.card.show {
    opacity: 1;
    transform: scale(1);
}

#story {
    min-height: 140px;
    line-height: 1.6;
    font-size: 17px;
}

#question {
    display: none;
    margin-top: 20px;
}

/* Buttons */
button.option {
    padding: 10px 24px;
    margin: 10px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s ease;
}

#yes {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 0 20px rgba(255,77,109,0.8);
}

#yes:hover {
    transform: scale(1.1);
}

#no {
    background: #999;
    color: white;
}
</style>
</head>

<body>

<button id="openBtn" onclick="openCard()">Open Message 💌</button>

<div class="card" id="card">
    <div id="story"></div>

    <div id="question">
        <h3>Will you be my Valentine? 💖</h3>
        <button id="yes" class="option" onclick="yesClicked()">YES 💘</button>
        <button id="no" class="option" onmouseover="moveNo()">NO 😜</button>
    </div>
</div>

<script>
/* Floating hearts */
function spawnHeart() {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["💖","💗","💓","💘"][Math.floor(Math.random()*4)];
    h.style.left = Math.random()*innerWidth + "px";
    h.style.top = innerHeight + "px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),8000);
}
setInterval(spawnHeart, 400);

/* Open Card */
function openCard() {
    document.getElementById("openBtn").style.display = "none";
    document.getElementById("card").classList.add("show");
    typeWriter();
}

/* Typing Story */
const message = `Hey You 💌

I wanted to say this properly…
Somehow, days feel warmer with you.
Smiles come easier.
Silences feel comfortable.
And moments feel… right ✨

So I was wondering ❤️`;

let i = 0;
function typeWriter() {
    if (i < message.length) {
        document.getElementById("story").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 35);
    } else {
        document.getElementById("question").style.display = "block";
    }
}

/* Move NO */
function moveNo() {
    const no = document.getElementById("no");
    no.style.position = "relative";
    no.style.left = (Math.random()*150 - 75) + "px";
}

/* YES */
function yesClicked() {
    document.getElementById("card").innerHTML = `
        <h2>💖 You Said YES 💖</h2>
        <p>This just made my day ✨</p>
        <h3>Happy Valentine’s Day 🌹</h3>
    `;
}
</script>

</body>
</html>
