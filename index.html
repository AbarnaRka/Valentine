<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1b1f3a, #0b0e1d);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    overflow: hidden;
}

/* Floating Hearts */
.heart {
    position: absolute;
    font-size: 18px;
    opacity: 0.15;
    animation: float 10s linear infinite;
}
@keyframes float {
    from { transform: translateY(0); opacity: 0.3; }
    to { transform: translateY(-110vh); opacity: 0; }
}

/* Button */
#startBtn {
    padding: 14px 35px;
    font-size: 18px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    background: #ffffff;
    color: #111;
    box-shadow: 0 0 30px rgba(255,255,255,0.3);
    transition: 0.3s ease;
}
#startBtn:hover {
    transform: scale(1.05);
}

/* Letter Card */
.letter {
    position: absolute;
    width: 500px;
    padding: 45px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(40px);
    transition: all 1s ease;
    text-align: center;
    line-height: 1.8;
}

.letter.show {
    opacity: 1;
    transform: translateY(0);
}

#story {
    color: #333;
    min-height: 200px;
    white-space: pre-line;
    font-size: 17px;
}

#question {
    display: none;
    margin-top: 20px;
}

button.option {
    padding: 10px 28px;
    margin: 10px;
    border-radius: 25px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s ease;
}

#yes {
    background: #ff4d6d;
    color: white;
}
#yes:hover {
    transform: scale(1.1);
}

#no {
    background: #e0e0e0;
    color: #333;
}
#no:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<button id="startBtn">Open Letter 💌</button>

<div class="letter" id="letter">
    <div id="story"></div>
    <div id="question">
        <h3>Will you be my Valentine? 💖</h3>
        <button id="yes" class="option">Yes 💘</button>
        <button id="no" class="option">No 😜</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const startBtn = document.getElementById("startBtn");
    const letter = document.getElementById("letter");
    const storyDiv = document.getElementById("story");
    const question = document.getElementById("question");
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");

    /* Floating hearts */
    function spawnHeart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = ["💖","💗","💓"][Math.floor(Math.random()*3)];
        h.style.left = Math.random()*window.innerWidth + "px";
        h.style.top = window.innerHeight + "px";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),10000);
    }
    setInterval(spawnHeart, 800);

    /* Open letter */
    startBtn.addEventListener("click", function () {
        startBtn.style.display = "none";
        letter.classList.add("show");
        typeWriter();
    });

    /* Typewriter */
    const message = `Hey You 💌

I wanted to say this properly…

Somehow, days feel warmer with you.
Smiles come easier.
Silences feel comfortable.

And moments feel… right ✨

So I was wondering ❤️`;

    let i = 0;

    function typeWriter() {
        if (i < message.length) {
            storyDiv.innerHTML += message.charAt(i);
            i++;
            setTimeout(typeWriter, 40);
        } else {
            question.style.display = "block";
        }
    }

    /* Move NO */
    noBtn.addEventListener("mouseover", function () {
        noBtn.style.position = "relative";
        noBtn.style.left = (Math.random()*150 - 75) + "px";
    });

    /* YES */
    yesBtn.addEventListener("click", function () {
        letter.innerHTML = `
            <h2 style="color:#111;">💖 You Said Yes 💖</h2>
            <p style="color:#333;">That just made everything brighter ✨</p>
            <h3 style="color:#111;">Happy Valentine’s Day 🌹</h3>
        `;
    });

});
</script>

</body>
</html>
