<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 💖</title>

<style>
/* ================== GLOBAL ================== */
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle, #1b1e44, #070815);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

/* ================== FLOATING HEARTS ================== */
.heart {
    position: absolute;
    font-size: 18px;
    animation: float 8s linear infinite;
    opacity: 0.9;
}

@keyframes float {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-120vh) scale(1.6); opacity: 0; }
}

/* ================== ENVELOPE ================== */
.envelope {
    width: 380px;
    height: 260px;
    position: relative;
    cursor: pointer;
}

/* BACK */
.envelope-back {
    position: absolute;
    inset: 0;
    background: #ffd6e0;
    border-radius: 18px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.45);
}

/* FRONT POCKET */
.envelope-front {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 65%;
    background: #ff8fab;
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    border-radius: 0 0 18px 18px;
    z-index: 4;
}

/* FLAP */
.envelope-flap {
    position: absolute;
    top: 0;
    width: 0;
    height: 0;
    border-left: 190px solid transparent;
    border-right: 190px solid transparent;
    border-bottom: 130px solid #ff4d6d;
    transform-origin: top;
    transition: transform 1s ease;
    z-index: 6;
}

/* ================== LETTER ================== */
.letter {
    position: absolute;
    inset: 12px;
    background: #fffdf8;
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    transform: translateY(60px);
    opacity: 0;
    transition: all 1.2s ease;
    z-index: 3;
}

/* paper texture */
.letter::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.03),
            rgba(0,0,0,0.03) 1px,
            transparent 1px,
            transparent 4px
        );
    border-radius: 14px;
    pointer-events: none;
}

/* OPEN STATE */
.envelope.open .envelope-flap {
    transform: rotateX(180deg);
}

.envelope.open .letter {
    transform: translateY(-40px);
    opacity: 1;
}

/* ================== STORY ================== */
#story p {
    font-size: 16px;
    color: #444;
    margin: 8px 0;
    animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ================== QUESTION ================== */
#question {
    margin-top: 16px;
}

button {
    padding: 10px 22px;
    border: none;
    border-radius: 25px;
    font-size: 15px;
    margin: 8px;
    cursor: pointer;
}

#yes {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 0 22px rgba(255,77,109,0.9);
}

#no {
    background: #adb5bd;
    color: white;
}
</style>
</head>

<body>

<div class="envelope" id="env" onclick="openEnvelope()">
    <div class="envelope-back"></div>

    <div class="letter">
        <div id="story"></div>

        <div id="question" style="display:none;">
            <h3>So tell me… 💖</h3>
            <h3>Will you be my Valentine?</h3>
            <button id="yes" onclick="yesClicked(event)">YES 💘</button>
            <button id="no" onmouseover="moveNo()">NO 😜</button>
        </div>
    </div>

    <div class="envelope-front"></div>
    <div class="envelope-flap"></div>
</div>

<script>
/* FLOATING HEARTS */
function heart() {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["💖","💘","💗","💓"][Math.floor(Math.random()*4)];
    h.style.left = Math.random()*innerWidth + "px";
    h.style.top = innerHeight + "px";
    h.style.fontSize = (16 + Math.random()*20) + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 8000);
}
setInterval(heart, 300);

/* STORY */
const lines = [
    "Hey You 💌",
    "I wanted to say this properly…",
    "Days feel warmer with you.",
    "Smiles come easier.",
    "Silences feel comfortable.",
    "Moments feel… right ✨",
    "So I was wondering ❤️"
];

let i = 0;
const story = document.getElementById("story");

function openEnvelope() {
    document.getElementById("env").classList.add("open");
    showStory();
}

function showStory() {
    if (i < lines.length) {
        const p = document.createElement("p");
        p.textContent = lines[i++];
        story.appendChild(p);
        setTimeout(showStory, 1000);
    } else {
        document.getElementById("question").style.display = "block";
    }
}

/* BUTTONS */
function moveNo() {
    document.getElementById("no").style.transform =
        `translate(${Math.random()*120-60}px,${Math.random()*50-25}px)`;
}

function yesClicked(e) {
    e.stopPropagation();
    document.querySelector(".letter").innerHTML = `
        <h2>💖 You Said YES 💖</h2>
        <p>This made my day brighter ✨</p>
        <h3>Happy Valentine’s Day 🌹</h3>
    `;
}
</script>

</body>
</html>
